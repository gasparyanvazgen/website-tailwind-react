<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>VazgenDev — Redirecting…</title>
    <script>
      // GitHub Pages serves this file for deep links; hand the original URL back to the React router.
      (function () {
        var base = "/";
        var path = window.location.pathname;
        var query = window.location.search;
        var hash = window.location.hash;
        var relative = path.indexOf(base) === 0 ? path.slice(base.length) : "";
        var target = base + "?redirect=" + encodeURIComponent("/" + relative + query + hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to VazgenDev…</p>
  </body>
</html>
